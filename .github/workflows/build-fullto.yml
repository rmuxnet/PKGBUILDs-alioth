      - uses: actions/upload-artifact@v4
        with:
          name: pkg-7p1-thin-5k
          path: linux-alioth-7p1/*.pkg.tar.*
          if-no-files-found: error

  build-7p1-thin-4p52k:
    runs-on: ubuntu-24.04-arm
    container:
      image: menci/archlinuxarm:base-devel
      options: --privileged
    name: 7.1.2 · ThinLTO · 4520mAh
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git clang llvm lld \
            xmlto docbook-xsl kmod inetutils bc uboot-tools dtc \
            python pahole
      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
