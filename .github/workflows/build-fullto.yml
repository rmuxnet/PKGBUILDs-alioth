          path: linux-alioth-7p1/*.pkg.tar.*
          if-no-files-found: error

  build-7p1-server-thin-5k:
    runs-on: ubuntu-24.04-arm
    container:
      image: menci/archlinuxarm:base-devel
      options: --privileged
    name: 7.1.2 · Server-ThinLTO · 5000mAh
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git clang llvm lld \
            xmlto docbook-xsl kmod inetutils bc uboot-tools dtc \
            python pahole
      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build
        working-directory: linux-alioth-7p1
        run: sudo -u builder env BATTERY=5000 bash build.sh server-thin
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-7p1-server-thin-5k
          path: linux-alioth-7p1/*.pkg.tar.*
          if-no-files-found: error

  build-7p1-server-thin-4p52k:
    runs-on: ubuntu-24.04-arm
    container:
      image: menci/archlinuxarm:base-devel
      options: --privileged
    name: 7.1.2 · Server-ThinLTO · 4520mAh
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git clang llvm lld \
            xmlto docbook-xsl kmod inetutils bc uboot-tools dtc \
            python pahole
      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build
        working-directory: linux-alioth-7p1
        run: sudo -u builder env BATTERY=4520 bash build.sh server-thin
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-7p1-server-thin-4p52k
          path: linux-alioth-7p1/*.pkg.tar.*
          if-no-files-found: error

  # ── publish ─────────────────────────────────────────────────────────────────
  publish:
    needs:
      - build-thin-5k
      - build-thin-4p52k
      - build-server-thin-5k
      - build-server-thin-4p52k
      - build-7p1-thin-5k
      - build-7p1-thin-4p52k
      - build-7p1-server-thin-5k
      - build-7p1-server-thin-4p52k
    if: always() && (
      needs.build-thin-5k.result == 'success' ||
      needs.build-thin-4p52k.result == 'success' ||
      needs.build-server-thin-5k.result == 'success' ||
      needs.build-server-thin-4p52k.result == 'success' ||
      needs.build-7p1-thin-5k.result == 'success' ||
      needs.build-7p1-thin-4p52k.result == 'success' ||
      needs.build-7p1-server-thin-5k.result == 'success' ||
      needs.build-7p1-server-thin-4p52k.result == 'success')
    runs-on: ubuntu-24.04-arm
    container:
      image: menci/archlinuxarm:base-devel
    steps:
      - name: Install repo tools
        run: pacman -Syu --noconfirm --needed pacman

      - uses: actions/download-artifact@v4
        with: { name: pkg-thin-5k,              path: dist }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: pkg-thin-4p52k,           path: dist }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: pkg-server-thin-5k,       path: dist }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: pkg-server-thin-4p52k,    path: dist }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: pkg-7p1-thin-5k,          path: dist }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: pkg-7p1-thin-4p52k,       path: dist }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: pkg-7p1-server-thin-5k,   path: dist }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: pkg-7p1-server-thin-4p52k, path: dist }
        continue-on-error: true

      - name: Build pacman repo database
        working-directory: dist
        run: |
          repo-add alioth.db.tar.zst *.pkg.tar.*
          rm -f alioth.db alioth.files
          cp -f alioth.db.tar.zst    alioth.db
          cp -f alioth.files.tar.zst alioth.files

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: repo
          name: alioth pacman repo
          body: |
            Rolling pacman repo for the alioth kernel.

            Add to /etc/pacman.conf:

              [alioth]
              SigLevel = Optional TrustAll
              Server = https://github.com/rmuxnet/PKGBUILDs-alioth/releases/download/repo

            Kernels (7.0.11):
              linux-alioth-ThinLTO-5k            — interactive, 5000mAh battery
              linux-alioth-ThinLTO-4p52k         — interactive, stock 4520mAh battery
              linux-alioth-Server-ThinLTO-5k     — server (PREEMPT_NONE, HZ=250, BBR), 5000mAh
              linux-alioth-Server-ThinLTO-4p52k  — server, stock 4520mAh battery

            Kernels (7.1.2):
              linux-alioth-7p1-ThinLTO-5k            — interactive, 5000mAh battery
              linux-alioth-7p1-ThinLTO-4p52k         — interactive, stock 4520mAh battery
              linux-alioth-7p1-Server-ThinLTO-5k     — server (PREEMPT_NONE, HZ=250, BBR), 5000mAh
              linux-alioth-7p1-Server-ThinLTO-4p52k  — server, stock 4520mAh battery
          files: |
            dist/*.pkg.tar.*
            dist/alioth.db
            dist/alioth.files
