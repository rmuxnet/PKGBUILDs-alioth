name: Build alioth packages + update pacman repo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bootmac/**'
      - 'device-xiaomi-alioth/**'
      - 'device-xiaomi-alioth-runit/**'
      - 'firmware-xiaomi-alioth/**'
      - 'hexagonrpcd/**'
      - 'hexagonrpcd-runit/**'
      - 'iio-sensor-proxy-libssc/**'
      - 'iio-sensor-proxy-libssc-runit/**'
      - 'libgbinder/**'
      - 'libglibutil/**'
      - 'libssc/**'
      - 'mkbootimg-alioth/**'
      - 'alioth-kernel-hooks/**'
      - 'python-gbinder-git/**'
      - 'qbootctl/**'
      - 'qbootctl-runit/**'
      - 'swclock-offset/**'
      - 'swclock-offset-runit/**'
      - 'widevine/**'
      - 'zramen/**'
      - 'zramen-runit/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: menci/archlinuxarm:base-devel
      options: --privileged

    name: build packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add ARMtix repos and install build deps
        run: |
          cat >> /etc/pacman.conf << 'EOF'

          [armtix]
          SigLevel = Never
          Server = https://repo.armtixlinux.org/armtix/os/$arch

          [system]
          SigLevel = Never
          Server = https://repo.armtixlinux.org/system/os/$arch

          [world]
          SigLevel = Never
          Server = https://repo.armtixlinux.org/world/os/$arch

          [galaxy]
          SigLevel = Never
          Server = https://repo.armtixlinux.org/galaxy/os/$arch
          EOF
          pacman -Syu --noconfirm --overwrite '*'
          # Install standard packages from ALARM repos (always available)
          pacman -S --noconfirm --needed --overwrite '*' \
            git meson ninja cmake cython \
            python python-setuptools squashfs-tools \
            bluez bluez-libs bluez-utils \
            libqmi protobuf-c gobject-introspection libqrtr-glib \
            libgudev polkit \
            nspr nss
          # Install Artix/ARMtix-specific packages
          pacman -S --noconfirm --needed \
            runit elogind artix-meson linux-headers 2>/dev/null || \
          pacman -S --noconfirm --needed \
            runit elogind linux-headers 2>/dev/null || \
          pacman -S --noconfirm --needed \
            runit elogind 2>/dev/null || true
          # artix-meson wrapper fallback if package unavailable
          command -v artix-meson &>/dev/null || {
            printf '#!/bin/bash\nexec meson setup --prefix=/usr --buildtype=plain "$@"\n' \
              > /usr/local/bin/artix-meson
            chmod +x /usr/local/bin/artix-meson
          }

      - name: Create unprivileged build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build packages
        run: |
          failed=()
          # Build order matters: deps before dependents
          pkgs=(
            libglibutil
            libgbinder
            libssc
            python-gbinder-git
            bootmac
            hexagonrpcd
            hexagonrpcd-runit
            qbootctl
            qbootctl-runit
            swclock-offset
            swclock-offset-runit
            iio-sensor-proxy-libssc
            iio-sensor-proxy-libssc-runit
            zramen
            zramen-runit
            widevine
            mkbootimg-alioth
            alioth-kernel-hooks
            firmware-xiaomi-alioth
            device-xiaomi-alioth
            device-xiaomi-alioth-runit
          )
          mkdir -p /dist
          for pkg in "${pkgs[@]}"; do
            if [ ! -d "$GITHUB_WORKSPACE/$pkg" ]; then
              echo "WARNING: $pkg not found, skipping"
              continue
            fi
            echo "==> Building $pkg"
            cd "$GITHUB_WORKSPACE/$pkg"
            if sudo -u builder bash -c "makepkg -f --noconfirm --skippgpcheck --skipchecksums --nodeps 2>&1"; then
              pkgfiles=$(ls *.pkg.tar.* 2>/dev/null)
              if [ -n "$pkgfiles" ]; then
                cp $pkgfiles /dist/
                # Install into container so subsequent packages can depend on it
                pacman -U --noconfirm --nodeps $pkgfiles 2>/dev/null || true
              fi
              echo "OK: $pkg"
            else
              echo "FAILED: $pkg"
              failed+=("$pkg")
            fi
            cd "$GITHUB_WORKSPACE"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::warning::Failed packages: ${failed[*]}"
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: pkg-extra
          path: /dist/*.pkg.tar.*
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-24.04-arm
    container:
      image: menci/archlinuxarm:base-devel

    steps:
      - name: Install repo tools
        run: pacman -Syu --noconfirm --needed pacman

      - name: Download new packages
        uses: actions/download-artifact@v4
        with:
          name: pkg-extra
          path: new-pkgs
        continue-on-error: true

      - name: Download existing repo packages
        uses: robinraju/release-downloader@v1
        with:
          repository: rmuxnet/PKGBUILDs-alioth
          tag: repo
          out-file-path: dist
          fileName: '*.pkg.tar.*'
        continue-on-error: true

      - name: Download existing repo db
        uses: robinraju/release-downloader@v1
        with:
          repository: rmuxnet/PKGBUILDs-alioth
          tag: repo
          out-file-path: dist
          fileName: 'alioth.db*'
        continue-on-error: true

      - name: Merge and rebuild repo database
        run: |
          mkdir -p dist
          cp new-pkgs/*.pkg.tar.* dist/ 2>/dev/null || true
          cd dist
          repo-add alioth.db.tar.zst *.pkg.tar.*
          rm -f alioth.db alioth.files
          cp -f alioth.db.tar.zst alioth.db
          cp -f alioth.files.tar.zst alioth.files

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: repo
          name: alioth pacman repo
          body: |
            Rolling pacman repo for alioth (Clang kernel + device packages).

            Add to /etc/pacman.conf:

              [alioth]
              SigLevel = Optional TrustAll
              Server = https://github.com/rmuxnet/PKGBUILDs-alioth/releases/download/repo
          files: |
            dist/*.pkg.tar.*
            dist/alioth.db
            dist/alioth.files
