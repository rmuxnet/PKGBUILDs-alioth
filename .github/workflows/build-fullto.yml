        with:
          name: pkg-server-thin-4p52k
          path: linux-alioth/*.pkg.tar.*
          if-no-files-found: error

  # ── 7.1.2 builds ──────────────────────────────────────────────────────────
  build-7p1-thin-5k:
    runs-on: ubuntu-24.04-arm
    container:
      image: menci/archlinuxarm:base-devel
      options: --privileged
    name: 7.1.2 · ThinLTO · 5000mAh
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git clang llvm lld \
            xmlto docbook-xsl kmod inetutils bc uboot-tools dtc \
