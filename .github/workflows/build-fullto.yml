name: Build alioth kernel (Clang ThinLTO) + pacman repo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'linux-alioth/**'
      - 'linux-alioth-7p1/**'

permissions:
  contents: write

jobs:
  # ── 7.0.11 builds ──────────────────────────────────────────────────────────
  build-thin-5k:
    runs-on: ubuntu-24.04-arm
    container:
      image: menci/archlinuxarm:base-devel
      options: --privileged
    name: 7.0.11 · ThinLTO · 5000mAh
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git clang llvm lld \
            xmlto docbook-xsl kmod inetutils bc uboot-tools dtc \
            python pahole
      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build
        working-directory: linux-alioth
        run: sudo -u builder env BATTERY=5000 bash build.sh thin
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-thin-5k
          path: linux-alioth/*.pkg.tar.*
          if-no-files-found: error

  build-thin-4p52k:
    runs-on: ubuntu-24.04-arm
    container:
      image: menci/archlinuxarm:base-devel
      options: --privileged
    name: 7.0.11 · ThinLTO · 4520mAh
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git clang llvm lld \
            xmlto docbook-xsl kmod inetutils bc uboot-tools dtc \
            python pahole
      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build
        working-directory: linux-alioth
        run: sudo -u builder env BATTERY=4520 bash build.sh thin
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-thin-4p52k
          path: linux-alioth/*.pkg.tar.*
          if-no-files-found: error

  build-server-thin-5k:
    runs-on: ubuntu-24.04-arm
    container:
      image: menci/archlinuxarm:base-devel
      options: --privileged
    name: 7.0.11 · Server-ThinLTO · 5000mAh
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git clang llvm lld \
            xmlto docbook-xsl kmod inetutils bc uboot-tools dtc \
            python pahole
      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build
        working-directory: linux-alioth
        run: sudo -u builder env BATTERY=5000 bash build.sh server-thin
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-server-thin-5k
          path: linux-alioth/*.pkg.tar.*
          if-no-files-found: error

  build-server-thin-4p52k:
    runs-on: ubuntu-24.04-arm
    container:
      image: menci/archlinuxarm:base-devel
      options: --privileged
    name: 7.0.11 · Server-ThinLTO · 4520mAh
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git clang llvm lld \
            xmlto docbook-xsl kmod inetutils bc uboot-tools dtc \
            python pahole
      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
