Syntax 3
# The ADSP frontends refuse to open without a route to a backend, and
# PipeWire probes the PCMs with only the verb applied, so the verb holds the
# static DSP and codec routing. The DSP paths only power up while a PCM runs.
#
# WCD9380 analog mics over SoundWire into the LPASS TX macro:
# bottom mic = AMIC1 -> ADC1 -> DEC0 = FL, top mic = AMIC5 -> ADC4 -> DEC1 = FR.
# ADCn Switch connects the codec SoundWire port and must be set before the
# PCM opens.
SectionVerb {
 EnableSequence [
  cset "name='TERT_TDM_RX_0 Audio Mixer MultiMedia1' 1"
  cset "name='TX DEC0 MUX' SWR_MIC"
  cset "name='TX SMIC MUX0' ADC0"
  cset "name='TX_AIF1_CAP Mixer DEC0' 1"
  cset "name='TX DEC1 MUX' SWR_MIC"
  cset "name='TX SMIC MUX1' ADC3"
  cset "name='TX_AIF1_CAP Mixer DEC1' 1"
  cset "name='TX0 MODE' ADC_NORMAL"
  cset "name='ADC1_MIXER Switch' 1"
  cset "name='ADC1 Switch' 1"
  cset "name='TX3 MODE' ADC_NORMAL"
  cset "name='ADC4 MUX' INP5"
  cset "name='ADC4_MIXER Switch' 1"
  cset "name='ADC4 Switch' 1"
  cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
 ]
 DisableSequence [
  cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
  cset "name='TERT_TDM_RX_0 Audio Mixer MultiMedia1' 0"
 ]
 Value {
  TQ "HiFi"
 }
}
# Two CS35L41 amps on Tertiary TDM: RCV (0x40) = top speaker/earpiece = FL,
# LCV (0x41) = bottom speaker = FR. The amps run in DSP bypass (no Cirrus
# protection firmware), so the analog gain stays well below Xiaomi's 18.
SectionDevice."Speaker" {
 Comment "Speaker playback"
 EnableSequence [
  cset "name='RCV PCM Source' ASP"
  cset "name='LCV PCM Source' ASP"
  cset "name='RCV PCM Soft Ramp' 4ms"
  cset "name='LCV PCM Soft Ramp' 4ms"
  cset "name='RCV Digital PCM Volume' 817"
  cset "name='LCV Digital PCM Volume' 817"
  cset "name='RCV Analog PCM Volume' 10"
  cset "name='LCV Analog PCM Volume' 10"
 ]
 Value {
  PlaybackPriority 200
  PlaybackPCM "hw:${CardId},0"
  PlaybackChannels 2
 }
}
# ADC Volume 8 = +12 dB analog, TX_DEC Volume 84 = 0 dB digital.
SectionDevice."Mic" {
 Comment "Internal microphones"
 EnableSequence [
  cset "name='ADC1 Volume' 8"
  cset "name='ADC4 Volume' 8"
  cset "name='TX_DEC0 Volume' 84"
  cset "name='TX_DEC1 Volume' 84"
 ]
 Value {
  CapturePriority 100
  CapturePCM "hw:${CardId},1"
  CaptureChannels 2
 }
}
