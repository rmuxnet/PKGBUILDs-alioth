# Speaker EQ for Xiaomi POCO F3 / Redmi K40 / Mi 11X (alioth)
#
# FL = top speaker (CS35L41 0x40, RCV), FR = bottom speaker (CS35L41 0x41, LCV).
#
# Per-speaker correction is fitted to Xiaomi's own alioth Dolby tuning
# (vendor/etc/dolby/dax-default.xml, speaker_landscape audio-optimizer).
# On top of it sits a Xiaomi 13 Pro (nuwa) style voicing: speaker-safe
# high-pass, a small bass lift just above it, and a tamed 3.7-4.7 kHz region.
#
# The amplifiers run without Cirrus speaker protection firmware and PipeWire
# has no builtin limiter, so the chain keeps headroom and clamps at -1 dBFS.

context.modules = [
{   name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
        node.description = "Speakers"
        media.name       = "Speakers"
        filter.graph = {
            nodes = [
                {
                    type  = builtin
                    name  = eq
                    label = param_eq
                    config = {
                        filters1 = [
                            { type = bq_highpass  freq = 300   q = 0.707 gain = 0.0 }
                            { type = bq_highpass  freq = 300   q = 0.707 gain = 0.0 }
                            { type = bq_lowshelf  freq = 500   q = 0.707 gain = 2.0 }
                            { type = bq_peaking   freq = 656   q = 1.4   gain = -1.2 }
                            { type = bq_peaking   freq = 844   q = 1.4   gain = -0.6 }
                            { type = bq_peaking   freq = 1313  q = 1.4   gain = 1.5 }
                            { type = bq_peaking   freq = 1688  q = 1.4   gain = 1.2 }
                            { type = bq_peaking   freq = 2250  q = 1.4   gain = -0.7 }
                            { type = bq_peaking   freq = 3000  q = 1.4   gain = -3.3 }
                            { type = bq_peaking   freq = 3750  q = 1.4   gain = -5.5 }
                            { type = bq_peaking   freq = 4688  q = 1.4   gain = -5.1 }
                            { type = bq_peaking   freq = 5813  q = 1.4   gain = -0.4 }
                            { type = bq_peaking   freq = 7125  q = 1.4   gain = 2.0 }
                            { type = bq_peaking   freq = 9000  q = 1.4   gain = 1.5 }
                            { type = bq_peaking   freq = 11250 q = 1.4   gain = 1.0 }
                            { type = bq_highshelf freq = 12000 q = 0.7   gain = 0.7 }
                        ]
                        filters2 = [
                            { type = bq_highpass  freq = 160   q = 0.707 gain = 0.0 }
                            { type = bq_highpass  freq = 160   q = 0.707 gain = 0.0 }
                            { type = bq_peaking   freq = 220   q = 1.0   gain = 3.0 }
                            { type = bq_peaking   freq = 469   q = 1.4   gain = -1.5 }
                            { type = bq_peaking   freq = 656   q = 1.4   gain = -1.8 }
                            { type = bq_peaking   freq = 844   q = 1.4   gain = -2.6 }
                            { type = bq_peaking   freq = 1031  q = 1.4   gain = -1.7 }
                            { type = bq_peaking   freq = 1313  q = 1.4   gain = 1.0 }
                            { type = bq_peaking   freq = 1688  q = 1.4   gain = 0.8 }
                            { type = bq_peaking   freq = 2250  q = 1.4   gain = -2.7 }
                            { type = bq_peaking   freq = 3000  q = 1.4   gain = -1.1 }
                            { type = bq_peaking   freq = 3750  q = 1.4   gain = -2.0 }
                            { type = bq_peaking   freq = 4688  q = 1.4   gain = -3.0 }
                            { type = bq_peaking   freq = 5813  q = 1.4   gain = -2.0 }
                            { type = bq_peaking   freq = 7125  q = 1.4   gain = -1.0 }
                            { type = bq_peaking   freq = 11250 q = 1.4   gain = 1.5 }
                            { type = bq_highshelf freq = 12000 q = 0.7   gain = 1.7 }
                        ]
                    }
                }
                { type = builtin name = gainL label = linear control = { "Mult" = 0.63 "Add" = 0.0 } }
                { type = builtin name = gainR label = linear control = { "Mult" = 0.63 "Add" = 0.0 } }
                { type = builtin name = clipL label = clamp  control = { "Min" = -0.89 "Max" = 0.89 } }
                { type = builtin name = clipR label = clamp  control = { "Min" = -0.89 "Max" = 0.89 } }
            ]
            links = [
                { output = "eq:Out 1"  input = "gainL:In" }
                { output = "eq:Out 2"  input = "gainR:In" }
                { output = "gainL:Out" input = "clipL:In" }
                { output = "gainR:Out" input = "clipR:In" }
            ]
            inputs  = [ "eq:In 1" "eq:In 2" ]
            outputs = [ "clipL:Out" "clipR:Out" ]
        }
        capture.props = {
            node.name         = "effect_input.alioth_speakers"
            media.class       = Audio/Sink
            audio.channels    = 2
            audio.position    = [ FL FR ]
            priority.session  = 2000
            priority.driver   = 2000
            device.icon-name  = "audio-speakers"
            filter.smart      = true
            filter.smart.name = "alioth-speaker-eq"
            filter.smart.target = { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
        }
        playback.props = {
            node.name          = "effect_output.alioth_speakers"
            node.passive       = true
            node.dont-fallback = true
            stream.dont-remix  = true
            audio.channels     = 2
            audio.position     = [ FL FR ]
        }
    }
}
]
